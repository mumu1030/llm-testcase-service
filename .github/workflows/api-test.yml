name: 接口自动化测试

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 装Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 装依赖
        run: pip install -r requirements-dev.txt
      
      - name: 启动被测服务
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -s -o /dev/null --max-time 1 http://127.0.0.1:8000/; then
              echo "第 $i 次探测：服务已就绪"
              exit 0
            fi
            echo "第 $i 次探测：还没好，等 1 秒"
            sleep 1
          done
          echo "====== 30 秒内未就绪,uvicorn 日志 ======"
          cat /tmp/uvicorn.log
          exit 1

      - name: 跑接口用例
        run: pytest tests/ -m "not llm" --log-cli-level=INFO --alluredir=allure-results -q
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
      
      - name: 生成HTML 报告
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      
      - name: 上传站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      
      - name: 发布到GitHub Pages
        uses: actions/deploy-pages@v5
    